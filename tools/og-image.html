<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social preview image — rendered by tools/build.py</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; color: #fff; font-family: Inter, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(135deg, #0b5f59 0%, #0f766e 55%, #14b8a6 100%);
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(520px 300px at 88% 10%, rgba(255, 255, 255, .16), transparent 60%),
      radial-gradient(420px 420px at 6% 96%, rgba(255, 255, 255, .10), transparent 60%);
  }
  .wrap { position: relative; height: 100%; display: flex; align-items: center; gap: 60px; padding: 0 84px 40px; }
  .photo {
    flex: none; width: 250px; height: 250px; border-radius: 50%; padding: 7px;
    background: linear-gradient(135deg, rgba(255, 255, 255, .95), rgba(255, 255, 255, .35));
    box-shadow: 0 24px 56px rgba(0, 0, 0, .28);
  }
  .photo img, .initials { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .initials { display: grid; place-items: center; background: rgba(255, 255, 255, .18); font: 800 84px Manrope, Inter, sans-serif; }
  [hidden] { display: none !important; }
  .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; opacity: .82; margin-bottom: 14px; }
  h1 { font: 800 72px/1.05 Manrope, Inter, sans-serif; letter-spacing: -.02em; margin-bottom: 12px; }
  .title { font-size: 30px; font-weight: 600; margin-bottom: 18px; opacity: .95; }
  .tagline { font-size: 22px; line-height: 1.45; opacity: .88; max-width: 700px; }
  .url {
    position: absolute; right: 84px; bottom: 44px; font-size: 20px; font-weight: 600;
    padding: 10px 18px; border-radius: 999px;
    background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .35);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="photo">
      <img id="photo" alt="">
      <div class="initials" id="initials" hidden></div>
    </div>
    <div>
      <p class="eyebrow">Curriculum Vitae</p>
      <h1 id="name"></h1>
      <p class="title" id="title"></p>
      <p class="tagline" id="tagline"></p>
    </div>
  </div>
  <div class="url" id="url"></div>

  <script src="../js/data.js"></script>
  <script>
    (function () {
      var D = window.CV_DATA || {};
      function set(id, v) { document.getElementById(id).textContent = v || ''; }
      set('name', D.name);
      set('title', D.title);
      set('tagline', D.tagline);
      set('url', (D.siteUrl || '').replace(/^https?:\/\//, '').replace(/\/$/, ''));
      var img = document.getElementById('photo');
      var ini = document.getElementById('initials');
      ini.textContent = D.initials || '';
      function fallback() { img.hidden = true; ini.hidden = false; }
      if (D.photo) { img.onerror = fallback; img.src = '../' + D.photo; } else { fallback(); }
    })();
  </script>
</body>
</html>
